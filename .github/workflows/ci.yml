name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run test suite
        run: python -m unittest discover -s tests -v

      - name: Smoke-test the installed CLI
        shell: bash
        run: |
          python -m pip install .
          pkgguard --version
          pkgguard scan tests/fixtures/benign_npm_pkg
          # The malicious fixture must fail the default gate.
          if pkgguard scan tests/fixtures/malicious_npm_pkg; then
            echo "::error::expected a non-zero exit for the malicious fixture"
            exit 1
          fi

  build:
    name: Build and check distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Build sdist and wheel
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*

      - name: Wheel must not ship test fixtures
        run: |
          if unzip -l dist/*.whl | grep -q fixtures; then
            echo "::error::test fixtures leaked into the wheel"
            exit 1
          fi
